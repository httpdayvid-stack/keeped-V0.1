.cl-lv{background:rgba(255,255,255,.16);padding:6px 16px;border-radius:99px;font-weight:600;animation:up .6s .9s backwards}
#cel .btn{margin-top:14px;animation:up .6s 1.2s backwards}
.wkh{display:flex;justify-content:space-between;align-items:center}
.wkd{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.dcell{display:flex;flex-direction:column;align-items:center;gap:6px}
.dcell small{font-size:11px;color:var(--mu)}
.dc{width:100%;max-width:46px;aspect-ratio:1;border-radius:50%;border:3px solid var(--tr);display:grid;place-items:center;font-size:14px}
.dc.g{border-color:#2fd08a;background:rgba(47,208,138,.22)}
.dc.o{border-color:#ffa63d;background:rgba(255,166,61,.22)}
.dc.r{border-color:#ff5468;background:rgba(255,84,104,.22)}
.dc.f,.dc.n{opacity:.45}
.dc.td{box-shadow:0 0 0 3px var(--ac)}
.leg{display:flex;gap:14px;justify-content:center;margin-top:14px;font-size:12px;color:var(--mu)}
.leg span{display:flex;gap:6px;align-items:center}
.leg i{width:10px;height:10px;border-radius:50%;display:block}
.leg .g,.bar.g{background:#2fd08a}.leg .o,.bar.o{background:#ffa63d}.leg .r,.bar.r{background:#ff5468}
.rg{display:flex;gap:16px;align-items:center}
.rgf{transition:stroke-dasharray .8s}
.bars{display:flex;gap:8px;align-items:flex-end;height:120px}
.bc{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px}
.bar{width:100%;border-radius:8px;background:var(--tr);transform-origin:bottom}
.bar.f,.bar.n{background:var(--tr)}
#app.enter .bar{animation:barup .7s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes barup{from{transform:scaleY(0)}}
.bc small{color:var(--mu);font-size:11px}
.bd{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.bd b{display:block;font:700 28px Fredoka,Figtree,sans-serif;color:var(--ac)}
.bd small{color:var(--mu)}
</style>
