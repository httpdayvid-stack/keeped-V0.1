.btn{border:1px solid var(--ln);background:none;border-radius:14px;padding:12px 16px;font-weight:700}

.dl{width:100%;font:inherit;color:inherit;resize:vertical;background:color-mix(in srgb,var(--ac) 10%,transparent);border:1px solid var(--ln);border-radius:14px;padding:12px;outline:0}
.mh{font-size:22px;margin:28px 0 2px;text-transform:capitalize}
.wh{color:var(--mu);font-size:13px;margin:14px 0 8px}
.en{margin-bottom:10px}
.ed{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;color:var(--mu);font-size:14px}
.ed svg{width:22px;height:22px;color:var(--ac)}
#pop{position:fixed;inset:0;z-index:50;background:hsl(var(--h) 60% 4%);color:#fff;display:none;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:28px;gap:14px}
#pop.show{display:flex}
#pop .src{color:var(--mu);font-size:14px}
#pop h2{font-size:clamp(26px,6vw,38px);max-width:520px;margin:0;line-height:1.2}
#pop .pl{display:grid;gap:8px;width:min(420px,100%)}
#pop .pl div{display:flex;justify-content:space-between;align-items:center;background:hsl(var(--h) 30% 13%);border-radius:12px;padding:10px 14px;gap:10px;text-align:left}
#pop .bt{display:grid;gap:10px;width:min(420px,100%);margin-top:10px}
#pop .btn{border-color:hsl(var(--h) 20% 26%);color:#fff;padding:15px}
#pop .btn.p{background:var(--ac);border-color:var(--ac)}
#pop .btn[disabled]{opacity:.4;cursor:not-allowed}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:14px;z-index:60;font-weight:500;max-width:90vw;text-align:center}
.note{background:color-mix(in srgb,var(--ac) 12%,transparent);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--mu);margin-bottom:14px}
@media (prefers-reduced-motion:no-preference){.toast{animation:in .25s}@keyframes in{from{opacity:0;transform:translate(-50%,-8px)}}}
</style>
<style>
#pop{top:0;left:0;right:0;bottom:0}
.cover::after{left:0;right:0;bottom:0}
@supports not (color:color-mix(in srgb,red,blue)){
.es.on,.seg button.on,nav button.on{background:rgba(255,255,255,.14)}
.dl,.note{background:rgba(255,255,255,.08)}
nav .plus{box-shadow:0 6px 18px rgba(0,0,0,.35)}
.tag{background:rgba(255,255,255,.14)}
}
</style>

<script>
const PAT="url('data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27180%27 height=%27180%27%3E%3Cg fill=%27%23e9d9f4%27 fill-opacity=%27.28%27%3E%3Cpath d=%27M36 22Q38 34 50 36Q38 38 36 50Q34 38 22 36Q34 34 36 22Z%27/%3E%3Cpath d=%27M132 104Q133.5 113 142 114.5Q133.5 116 132 125Q130.5 116 122 114.5Q130.5 113 132 104Z%27/%3E%3Ccircle cx=%27110%27 cy=%2730%27 r=%272%27/%3E%3Ccircle cx=%2760%27 cy=%27140%27 r=%272.5%27/%3E%3C/g%3E%3Cellipse cx=%2790%27 cy=%2790%27 rx=%2740%27 ry=%2714%27 transform=%27rotate(-28 90 90)%27 fill=%27none%27 stroke=%27%23e9d9f4%27 stroke-opacity=%27.18%27/%3E%3C/svg%3E'),";

cfg:{wait:10,inc:10,max:60,apps:{Instagram:true,TikTok:true,YouTube:false,X:false}},

let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}

const ic=(n,s=20,f)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="${f?'currentColor':'none'}" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;

const MES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const dk=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const de=(k=dk())=>S.diary[k]||(S.diary[k]={t:'',m:S.mood,e:S.en});

function list(k){return L(k)+`<button class="btn add" data-a="add" data-k="${k}">${ic('plus',16)} ${{meds:'Adicionar remédio',tasks:'Adicionar tarefa',habits:'Adicionar hábito'}[k]}</button>`}

${card('Tarefas',n+' para hoje',list('tasks'))}
${card('Hábitos de hoje',S.habits.filter(h=>h.d).length+'/'+S.habits.length,list('habits'))}
${card('Como foi hoje?','',`<div>Humor</div><div class="seg">${[1,2,3,4,5].map((e,i)=>`<button class="${S.mood===i+1?'on':''}" data-a="mood" data-v="${i+1}" aria-label="Humor ${i+1}">${face(i+1)}</button>`).join('')}</div><div>Energia</div><div class="seg">${[1,2,3,4,5].map(i=>`<button class="${S.en===i?'on':''}" data-a="en" data-v="${i}" aria-label="Energia ${i}">${bars(i)}</button>`).join('')}</div><input class="dl" data-a="note" maxlength="200" placeholder="Uma linha sobre o dia (opcional)" value="${esc((S.diary[dk()]||{}).t||'')}" aria-label="Uma linha sobre o dia">`)}
</div></main>`},
tasks(){return`<main class="page"><h2>Tarefas</h2>${card('Todas',S.tasks.filter(t=>!t.d).length+' abertas',list('tasks'))}</main>`},
habits(){return`<main class="page"><h2>Hábitos</h2>${card('Hoje',S.habits.filter(h=>h.d).length+'/'+S.habits.length,list('habits'))}</main>`},
meds(){return`<main class="page"><h2>Remédios</h2>${card('Horários',S.meds.filter(m=>m.d).length+'/'+S.meds.length+' tomados',list('meds'))}<div class="note" style="margin-top:14px">No app Android, cada remédio vai avisar no horário e repetir até você marcar que tomou.</div></main>`},
cfg(){const c=S.cfg;return`<main class="page"><h2>Ajustes</h2><div class="grid">${window.__perm?card('Permissões do bloqueio','',`<div class="note">Libere as 3 opções para o bloqueio funcionar.</div><div style="display:grid;gap:8px"><button class="btn p" data-a="perm" data-n="usage">1. Acesso ao uso</button><button class="btn p" data-a="perm" data-n="overlay">2. Exibir sobre outros apps</button><button class="btn" data-a="perm" data-n="battery">3. Sem restrição de bateria</button></div>`):''}
${card('Bloqueio de apps','',`<div class="note">Simulação. O bloqueio real só funciona na versão APK, com as permissões “Acesso ao uso” e “Exibir sobre outros apps”.</div>${Object.keys(c.apps).map(a=>`<label class="chk"><input type="checkbox" data-a="app" data-n="${a}" ${c.apps[a]?'checked':''}> ${a}</label>`).join('')}
<div class="f"><label>Espera inicial (segundos)</label><input type="number" min="0" max="300" data-a="cfg" data-n="wait" value="${c.wait}"></div>
<div class="f"><label>Aumento a cada tentativa no dia (segundos)</label><input type="number" min="0" max="120" data-a="cfg" data-n="inc" value="${c.inc}"></div>
<div class="f"><label>Espera máxima (segundos)</label><input type="number" min="0" max="600" data-a="cfg" data-n="max" value="${c.max}"></div>
<div>Tentativas hoje: <b>${S.tries}</b> <button class="btn" data-a="reset" style="margin-left:8px;padding:6px 12px">Zerar</button></div>`)}
${card('Testar o pop-up','',`<p style="color:var(--mu);margin-top:0">Escolha um app vigiado para ver o que apareceria na tela.</p><div style="display:flex;gap:8px;flex-wrap:wrap">${Object.keys(c.apps).filter(a=>c.apps[a]).map(a=>`<button class="btn p" data-a="sim" data-n="${a}">Abrir ${a}</button>`).join('')||'<span class="empty">Ative um app ao lado.</span>'}</div>`)}
${card('Aparência','',`<div class="f"><label>Tema</label><select data-a="theme"><option value="auto" ${S.theme==='auto'?'selected':''}>Automático</option><option value="dark" ${S.theme==='dark'?'selected':''}>Escuro</option><option value="light" ${S.theme==='light'?'selected':''}>Claro</option></select></div>
<div class="f"><label>Cor de destaque</label><div class="sw">${accents.map(h=>`<button class="${(HUE())===h?'on':''}" style="background:hsl(${h} 55% 55%)" data-a="acc" data-n="${h}" aria-label="Cor ${h}"></button>`).join('')}<input type="color" data-a="hue" value="${hueHex(HUE())}" aria-label="Escolher outra cor"></div></div>
<div class="f"><label>Capa do Início</label><select data-a="cover">${Object.keys(covers).map(c=>`<option ${S.cover===c?'selected':''}>${c}</option>`).join('')}</select></div>`)}
</div></main>`},
rotina(){const t=S.tab||'tasks';return`<main class="page"><h2>Rotina</h2><div class="seg">${[['tasks','Tarefas'],['habits','Hábitos'],['meds','Remédios']].map(([x,l])=>`<button class="${t===x?'on':''}" data-a="tab" data-n="${x}">${l}</button>`).join('')}</div>`+V[t]().replace(/^<main class="page"><h2>[^<]*<\/h2>/,'')},
diary(){const dkey=dk(),ks=Object.keys(S.diary).filter(k=>S.diary[k].t||k===dkey);if(!ks.includes(dkey))ks.push(dkey);ks.sort().reverse();let h='',cm='',cw='';
ks.forEach(k=>{const d=new Date(k+'T12:00'),m=MES[d.getMonth()]+' de '+d.getFullYear(),w=new Date(d);w.setDate(d.getDate()-(d.getDay()+6)%7);const we=new Date(w);we.setDate(w.getDate()+6);const wl='Semana de '+w.getDate()+' '+MES[w.getMonth()].slice(0,3)+' a '+we.getDate()+' '+MES[we.getMonth()].slice(0,3);
if(m!==cm){cm=m;cw='';h+=`<h3 class="mh">${m}</h3>`}
if(wl!==cw){cw=wl;h+=`<div class="wh">${wl}</div>`}
const e=S.diary[k]||{};h+=`<div class="en"><div class="ed"><b>${d.toLocaleDateString('pt-BR',{weekday:'short',day:'numeric'})}${k===dkey?' · hoje':''}</b>${e.m?face(e.m):''}</div><textarea class="dl" rows="2" data-a="note" data-d="${k}" placeholder="Escreva sobre o dia…" aria-label="Diário de ${k}">${esc(e.t||'')}</textarea></div>`});
return`<main class="page"><h2>Diário</h2>${h}</main>`}};
function render(){applyTheme();const v=S.view;
$('app').innerHTML=V[v]()+`<nav>${[['home','home','Início'],['rotina','tasks','Rotina'],['diary','book','Diário'],['cfg','cfg','Ajustes']].map(([id,icn,l])=>`<button class="${v===id?'on':''}" data-a="nav" data-n="${id}"><i>${ic(icn,22)}</i>${l}</button>`).join('')}<button class="plus" data-a="add" aria-label="Criar novo">${ic('plus',26)}</button></nav>`;save()}
function addDlg(k){const d=$('dlg');d.innerHTML=`<form data-a="new" method="dialog"><h2>Criar novo</h2>
<div class="f"><label>Tipo</label><select id="nk"><option value="tasks">Tarefa</option><option value="habits">Hábito</option><option value="meds">Remédio</option></select></div>
<div class="f"><label>Nome</label><input id="nn" required></div>
<div class="f" id="mx" style="display:none"><label>Horário</label><input id="nt" type="time" value="08:00"><label>Dose</label><input id="nd" placeholder="Ex.: 1 comprimido"></div>
<label class="chk"><input type="checkbox" id="ne"> Essencial (ativa o bloqueio de apps)</label>
<div class="f"><label>Mensagem do pop-up (opcional)</label><input id="nm" placeholder="Ex.: Você ainda não tirou o lixo."></div>
<div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn" data-a="close">Cancelar</button><button class="btn p">Salvar</button></div></form>`;
d.showModal();const sync=()=>{const m=$('nk').value==='meds';$('mx').style.display=m?'grid':'none';if(m)$('ne').checked=true};$('nk').onchange=sync;if(k){$('nk').value=k;sync()}}
let timer;
function pop(app){const p=pend();if(!p.length){toast('Nenhuma pendência essencial: '+app+' abriria normalmente.');return}
const c=S.cfg,w=Math.min(c.max,c.wait+c.inc*S.tries);S.tries++;save();let left=w;
const one=p.length===1?p[0]:null;
const msg=one?(one.o.m||(one.k==='meds'?'Você ainda não tomou seu remédio.':'Você ainda não concluiu: '+one.o.n+'.')):'Você ainda tem tarefas pendentes.';
const verb=one?KIND[one.k].verb:'Já fiz tudo';
const el=$('pop');
function draw(){el.innerHTML=`<div class="src">Você abriu o ${esc(app)} · tentativa ${S.tries} hoje</div><h2>${esc(msg)}</h2>${one?'':`<div class="pl">${p.map(x=>`<div><span style="display:flex;gap:8px;align-items:center">${ic(KIND[x.k].ic,18)} ${esc(x.o.n)}</span></div>`).join('')}</div>`}
<div class="bt"><button class="btn p" data-a="pdone">${verb}</button><button class="btn" data-a="popen">Abrir Keeped</button><button class="btn" data-a="pgo" data-n="${esc(app)}" ${left>0?'disabled':''}>${left>0?`Continuar no ${esc(app)} (${left}s)`:`Continuar no ${esc(app)}`}</button></div>`}
draw();el.classList.add('show');clearInterval(timer);
timer=setInterval(()=>{left--;const b=el.querySelector('[data-a=pgo]');if(!b){clearInterval(timer);return}
if(left<=0){clearInterval(timer);draw()}else b.textContent=`Continuar no ${app} (${left}s)`},1000)}
function closePop(){clearInterval(timer);$('pop').classList.remove('show')}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,k=b.dataset.k,i=+b.dataset.i,n=b.dataset.n;
if(a==='nav'){S.view=n;render();scrollTo(0,0)}
else if(a==='tog'){S[k][i].d=!S[k][i].d;render()}
else if(a==='del'){S[k].splice(i,1);render()}
else if(a==='ess'){S[k][i].e=!S[k][i].e;render()}
else if(a==='tab'){S.tab=n;render()}
else if(a==='mood'){S.mood=+b.dataset.v;de().m=S.mood;render()}
else if(a==='en'){S.en=+b.dataset.v;de().e=S.en;render()}
else if(a==='add')addDlg(k);
else if(a==='close')$('dlg').close();
else if(a==='acc'){S.hue=+n;render()}
else if(a==='reset'){S.tries=0;render()}
else if(a==='sim')pop(n);
else if(a==='perm'){window.__perm&&window.__perm(n)}
else if(a==='pdone'){const p=pend();p.forEach(x=>{S[x.k][x.i].d=true});closePop();toast('Marcado como concluído. App liberado.');render()}
else if(a==='popen'){const p=pend();closePop();S.view='rotina';S.tab=p.length===1&&p[0].k==='meds'?'meds':'tasks';render()}
else if(a==='pgo'&&!b.disabled){closePop();toast('Abrindo '+n+'…')}});
document.addEventListener('change',e=>{const t=e.target,a=t.dataset.a;if(!a)return;
if(a==='app'){S.cfg.apps[t.dataset.n]=t.checked;render()}
else if(a==='cfg'){S.cfg[t.dataset.n]=Math.max(0,+t.value||0);save()}
else if(a==='theme'){S.theme=t.value;render()}
else if(a==='cover'){S.cover=t.value;render()}
else if(a==='note'){const e=de(t.dataset.d||dk());e.t=t.value.trim();save()}
else if(a==='hue'){S.hue=hexHue(t.value);render()}});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-a]');if(!f)return;const a=f.dataset.a;
if(a==='quick'){e.preventDefault();const v=$('qi').value.trim();if(v){S.tasks.unshift({n:v,d:false,e:false,m:''});render()}}
else if(a==='new'){const k=$('nk').value,o={n:$('nn').value.trim(),d:false,e:$('ne').checked,m:$('nm').value.trim()};
if(k==='meds'){o.time=$('nt').value;o.dose=$('nd').value.trim()||'—'}if(k==='habits')o.s=0;
S[k].push(o);S.view='rotina';S.tab=k;render();toast('Criado.')}});
(function(){try{const C=window.Capacitor;if(!C||!C.isNativePlatform||!C.isNativePlatform())return;
const reg=n=>C.registerPlugin?C.registerPlugin(n):((C.Plugins&&C.Plugins[n])||{});const B=reg('Blocker'),LN=reg('LocalNotifications');
const PK={Instagram:'com.instagram.android',TikTok:'com.zhiliaoapp.musically',YouTube:'com.google.android.youtube',X:'com.twitter.android'};
const PM={usage:'openUsageSettings',overlay:'openOverlaySettings',battery:'openBatterySettings'};
window.__perm=n=>{try{B[PM[n]]()}catch(e){}};
let t;
window.__sync=()=>{clearTimeout(t);t=setTimeout(async()=>{try{
const pkgs={};Object.keys(S.cfg.apps).forEach(n=>{if(S.cfg.apps[n]&&PK[n])pkgs[PK[n]]=n});
const items=pend().map(x=>({id:x.k+':'+x.i,k:x.k,t:x.o.n,m:x.o.m||'',verb:KIND[x.k].verb}));
await B.setState({pkgs,items,wait:S.cfg.wait,inc:S.cfg.inc,max:S.cfg.max,ac:hueHex(HUE())});
await LN.cancel({notifications:Array.from({length:30},(_,i)=>({id:1000+i}))});
const ns=S.meds.map((m,i)=>{const [h,mi]=(m.time||'08:00').split(':').map(Number);return{id:1000+i,title:'Hora do remédio',body:m.n+(m.dose&&m.dose!=='—'?' · '+m.dose:''),schedule:{on:{hour:h,minute:mi},allowWhileIdle:true}}});
if(ns.length)await LN.schedule({notifications:ns});
}catch(e){}},400)};
async function pull(){try{const d=await B.getDone();const a=d.done||[];a.forEach(id=>{const [k,i]=id.split(':');if(S[k]&&S[k][+i])S[k][+i].d=true});if(a.length)render()}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
try{LN.requestPermissions()}catch(e){}
pull();window.__sync();
}catch(e){}})();
render();
</script>
</body>
</html>
